<style>/* ============================================================
   Derya Dilara — Design System
   Global entry point. Consumers link this ONE file.
   Import order: fonts → tokens. Keep this file as @imports only.
   ============================================================ */
/* Derya Dilara — webfonts. Instrument Sans + Instrument Serif (SIL OFL, licenses in assets/fonts/). */
@font-face{
  font-family:"Instrument Sans";
  src:url("https://deryadilaraa.github.io/D/assets/InstrumentSans.ttf") format("truetype");
  font-weight:400 700;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"Instrument Serif";
  src:url("https://deryadilaraa.github.io/D/assets/InstrumentSerif-Regular.ttf") format("truetype");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}

/* ============================================================
   Derya Dilara — Colour tokens
   A near-monochrome editorial system: ink on white, with warm
   "colour that makes us feel something" reserved for artwork.
   ============================================================ */
:root{
  /* --- Ink & ground (base) --- */
  --dda-ink: #111111;          /* primary text, heavy rule */
  --dda-muted: #626262;        /* secondary / meta text */
  --dda-white: #ffffff;        /* the page ground */

  /* --- Hairline greys (borders/rules, light → heavy) --- */
  --dda-rule-faint: #e6e6e6;
  --dda-rule-soft: #dedede;    /* project dividers */
  --dda-rule: #d5d5d5;
  --dda-rule-mid: #cfcfcf;     /* section-head underline */
  --dda-rule-cv: #dddddd;      /* cv row rules */

  /* --- Interaction --- */
  --dda-focus: #1547df;        /* focus ring + link accent */

  /* --- Scrims / overlays --- */
  --dda-caption-bg: rgba(255,255,255,0.93); /* white-on-image caption */
  --dda-nav-shadow: 0 8px 30px rgba(0,0,0,0.08);

  /* ------------------------------------------------------------
     Colour-study accents — "warm human" editorial palette drawn
     from the portfolio's colour studies & mood imagery.
     For artwork, illustration and expressive moments ONLY;
     never for UI chrome, body text or backgrounds.
     ------------------------------------------------------------ */
  --dda-coral: #ff693b;        /* study 01 */
  --dda-sun: #ffd73e;          /* study 01 */
  --dda-fuchsia: #f036a4;      /* study 01 / 02 */
  --dda-magenta: #f036a4;
  --dda-cobalt: #193ab8;       /* study 02 */
  --dda-ultramarine: #1547df;  /* shared with focus */
  --dda-lilac: #e9adff;        /* study 02 */
  --dda-ember: #fd7738;        /* study 02 */

  /* ---- Semantic aliases ---- */
  --dda-text: var(--dda-ink);
  --dda-text-muted: var(--dda-muted);
  --dda-surface: var(--dda-white);
  --dda-surface-invert: var(--dda-ink);
  --dda-border: var(--dda-rule-soft);
  --dda-border-strong: var(--dda-ink);
  --dda-link: var(--dda-ink);
  --dda-link-focus: var(--dda-focus);
}

/* ============================================================
   Derya Dilara — Typography tokens
   Instrument Serif for editorial headlines; Instrument Sans for
   everything structural (body, nav, labels, captions).
   Sizes use the portfolio's exact fluid clamps.
   ============================================================ */
:root{
  /* --- Families --- */
  --dda-font-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --dda-font-sans: "Instrument Sans", system-ui, Arial, sans-serif;

  /* --- Weights (Sans is variable 400–700) --- */
  --dda-w-regular: 400; /* @kind font */
  --dda-w-medium: 500; /* @kind font */
  --dda-w-bold: 700; /* @kind font */

  /* --- Display / editorial headings (serif) --- */
  --dda-display-hero: clamp(54px, 8.8vw, 128px); /* @kind font */
  --dda-display-1: clamp(42px, 5.2vw, 76px); /* @kind font */
  --dda-display-2: clamp(36px, 4vw, 56px); /* @kind font */
  --dda-display-3: clamp(33px, 3.7vw, 52px); /* @kind font */

  /* --- Body / UI (sans) --- */
  --dda-text-lead: 19px;    /* about intro */
  --dda-text-body: 17px;    /* project copy */
  --dda-text-base: 16px;    /* default */
  --dda-text-nav: 17px;     /* header brand + menu */
  --dda-text-sm: 14px;      /* cv meta */
  --dda-text-xs: 12px;      /* notes, captions, foot */
  --dda-text-label: 11px;   /* eyebrows */

  /* --- Leading --- */
  --dda-leading-display: 1.01;  /* tight editorial */
  --dda-leading-head: 1.1;
  --dda-leading-snug: 1.2;
  --dda-leading-body: 1.6;
  --dda-leading-base: 1.45;

  /* --- Tracking --- */
  --dda-track-display: -0.035em; /* h1 */
  --dda-track-head: -0.025em;    /* h2/h3 */
  --dda-track-brand: -0.7px;     /* wordmark in header */
  --dda-track-label: 0.09em;     /* uppercase eyebrow */
}

/* ============================================================
   Derya Dilara — Spacing, layout, radii, motion
   Editorial rhythm: generous vertical air, flat surfaces,
   square corners, quiet fades. Values lifted from the portfolio.
   ============================================================ */
:root{
  /* --- Spacing scale (4px rhythm) --- */
  --dda-space-1: 4px;
  --dda-space-2: 8px;
  --dda-space-3: 12px;
  --dda-space-4: 16px;
  --dda-space-5: 20px;
  --dda-space-6: 24px;
  --dda-space-8: 32px;
  --dda-space-10: 40px;
  --dda-space-16: 64px;
  --dda-space-20: 80px;
  --dda-space-24: 96px;
  --dda-space-32: 128px;
  --dda-space-36: 140px;   /* about section margin */

  /* --- Page gutters --- */
  --dda-gutter: 24px;      /* header / opening */
  --dda-gutter-wide: 40px; /* work / cv */

  /* --- Container widths --- */
  --dda-max-prose: 650px;
  --dda-max-copy: 440px;
  --dda-max-narrow: 1040px;
  --dda-max-content: 1200px;
  --dda-max-work: 1440px;
  --dda-max-gallery: 1800px;

  /* --- Grid --- */
  --dda-grid-gap: 20px;
  --dda-grid-cols: 9; /* @kind other */

  /* --- Radii: editorial = square. Media & cards are NOT rounded. --- */
  --dda-radius-0: 0px;
  --dda-radius-focus: 0px;

  /* --- Borders --- */
  --dda-border-hairline: 1px;

  /* --- Elevation: near-flat. Only the nav popover lifts. --- */
  --dda-shadow-none: none;
  --dda-shadow-pop: 0 8px 30px rgba(0,0,0,0.08);

  /* --- Motion: quiet fades, no bounce --- */
  --dda-ease: cubic-bezier(0.2, 0, 0.2, 1); /* @kind other */
  --dda-dur-fast: 0.2s; /* @kind other */
  --dda-dur-mid: 0.3s; /* @kind other */
  --dda-focus-offset: 5px; /* @kind spacing */
  --dda-underline-offset: 4px; /* @kind spacing */
}

</style>




<style>
html,body{margin:0;background:#fff}
#dda-portfolio{background:#fff;color:var(--dda-ink);font-family:var(--dda-font-sans);font-size:16px;line-height:1.45;text-align:left}
#dda-portfolio *{box-sizing:border-box}
#dda-portfolio :where(h1,h2,h3,p,figure,ul){margin:0;padding:0}
#dda-portfolio a:focus-visible{outline:2px solid var(--dda-focus);outline-offset:5px}
#dda-portfolio .dda-header{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:5;padding:22px 24px 16px}
#dda-portfolio .dda-brand{letter-spacing:-.7px;text-decoration:none;color:inherit}
#dda-portfolio .dda-opening{padding:0 24px}
#dda-portfolio .dda-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:20px;grid-template-rows:repeat(4,clamp(105px,10.8vw,160px));max-width:1800px;margin:auto}
#dda-portfolio .dda-gallery-foot{display:flex;justify-content:space-between;gap:24px;margin:22px 0 0;font-size:12px;line-height:1.4}
#dda-portfolio .dda-about{max-width:1200px;margin:140px auto 130px;padding:0 40px;display:grid;grid-template-columns:1fr 2fr;gap:70px;scroll-margin-top:35px}
#dda-portfolio h1{font-family:var(--dda-font-serif);font-weight:400;font-size:clamp(42px,5.2vw,76px);line-height:1.01;letter-spacing:-.035em;max-width:780px;margin:0 0 32px}
#dda-portfolio .dda-intro{font-size:19px;line-height:1.55;max-width:650px}
#dda-portfolio .dda-threads{display:grid;grid-template-columns:repeat(3,1fr);gap:36px;margin-top:8px;max-width:820px}
#dda-portfolio .dda-thread h3{font-family:var(--dda-font-serif);font-weight:400;font-size:24px;letter-spacing:-.02em;margin:0 0 10px}
#dda-portfolio .dda-thread p{font-size:15px;line-height:1.55;color:var(--dda-ink);margin:0}
#dda-portfolio .dda-points{display:flex;flex-wrap:wrap;gap:22px 34px}
#dda-portfolio .dda-point{max-width:200px}
#dda-portfolio .dda-point strong{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
#dda-portfolio .dda-work{padding:0 40px;max-width:1440px;margin:auto}
#dda-portfolio .dda-work h2{font-family:var(--dda-font-serif);font-weight:400;font-size:clamp(36px,4vw,56px);letter-spacing:-.025em;line-height:1.1}
#dda-portfolio .dda-curated{padding:70px 40px 30px;max-width:1440px;margin:auto;scroll-margin-top:20px}
#dda-portfolio .dda-masonry{columns:4;column-gap:20px;margin-top:44px}
#dda-portfolio .dda-cur-img{width:100%;display:block;margin:0 0 20px;break-inside:avoid;filter:saturate(1);transition:filter .3s var(--dda-ease),opacity .3s var(--dda-ease)}
#dda-portfolio .dda-cur-img:hover{filter:saturate(1.08)}
#dda-portfolio .dda-project:nth-of-type(odd){}
#dda-portfolio .dda-cv{display:grid;grid-template-columns:1fr 2fr;gap:70px;padding:90px 40px;max-width:1200px;margin:auto;scroll-margin-top:20px}#dda-portfolio .dda-cv h2{font-family:var(--dda-font-serif);font-weight:400;font-size:clamp(36px,4vw,56px);letter-spacing:-.025em;line-height:1.1}
#dda-portfolio .dda-contact{margin:0 24px;padding:75px 16px 30px;border-top:1px solid var(--dda-ink);scroll-margin-top:20px}
#dda-portfolio .dda-contact-h{font-family:var(--dda-font-serif);font-weight:400;font-size:clamp(54px,8.8vw,128px);max-width:1000px;line-height:.98;letter-spacing:-.035em;margin:20px 0 30px}
#dda-portfolio .dda-contact p{max-width:480px;font-size:17px;line-height:1.6}
#dda-portfolio .dda-contact-links{display:flex;flex-wrap:wrap;gap:14px 28px;margin-top:26px;font-size:17px}
#dda-portfolio .dda-footer{display:flex;justify-content:space-between;gap:24px;font-size:12px;color:var(--dda-muted);margin-top:90px}
@media(max-width:800px){
  #dda-portfolio .dda-masonry{columns:2}
  #dda-portfolio .dda-threads{grid-template-columns:1fr;gap:24px;max-width:none}
  #dda-portfolio .dda-about,#dda-portfolio .dda-cv{grid-template-columns:1fr;gap:30px;padding:0 24px}
  #dda-portfolio .dda-about{margin:110px auto 90px}
  #dda-portfolio .dda-work{padding:0 24px}
  #dda-portfolio .dda-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,26vw);gap:36px 12px}
}
@media(prefers-reduced-motion:reduce){#dda-portfolio *{transition:none!important;scroll-behavior:auto!important}}
</style><style>
@media(max-width:800px){
#dda-portfolio .dda-grid{grid-template-rows:repeat(6,29vw);gap:40px 12px}
#dda-portfolio .dda-grid>a:nth-child(1){grid-area:1/1/span 1/span 2!important}
#dda-portfolio .dda-grid>a:nth-child(2){grid-area:1/4!important}
#dda-portfolio .dda-grid>a:nth-child(3){grid-area:2/2!important}
#dda-portfolio .dda-grid>a:nth-child(4){grid-area:2/3/span 1/span 2!important}
#dda-portfolio .dda-grid>a:nth-child(5){grid-area:3/1!important}
#dda-portfolio .dda-grid>a:nth-child(6){grid-area:3/3!important}
#dda-portfolio .dda-grid>a:nth-child(7){grid-area:4/1/span 1/span 2!important}
#dda-portfolio .dda-grid>a:nth-child(8){grid-area:4/4!important}
#dda-portfolio .dda-grid>a:nth-child(9){grid-area:5/2!important}
#dda-portfolio .dda-grid>a:nth-child(10){grid-area:5/3/span 1/span 2!important}
#dda-portfolio .dda-grid>a:nth-child(11){grid-area:6/1!important}
#dda-portfolio .dda-grid>a:nth-child(12){grid-area:6/4!important}
#dda-portfolio .dda-work>div:first-child,#dda-portfolio .dda-curated>div:first-child{flex-wrap:wrap;gap:16px!important}
#dda-portfolio .dda-work>div:first-child>p,#dda-portfolio .dda-curated>div:first-child>p{flex-shrink:1!important;text-align:left!important}
#dda-portfolio .dda-project{grid-template-columns:1fr!important;gap:28px!important;padding:48px 0!important}
#dda-portfolio .dda-project figure{order:0!important}
#dda-portfolio .dda-footer{flex-wrap:wrap}
#dda-portfolio .dda-cv{padding:64px 24px}
}
</style>
